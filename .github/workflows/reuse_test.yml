name: Reuse Workflow

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
        
jobs:
  greeting:
    name: Greeting1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Good Morning
        run: |
          echo "Good Morning!"

  greeting_need_check:
    name: Greeting2
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Hello World
        run: |
          echo "Hello World!"